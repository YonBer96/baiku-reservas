{% extends "reservas/base.html" %}

{% block content %}
{% include "reservas/partials/progreso.html" %}

<div class="card">
    <h2>Fecha</h2>
    <p class="helper-text">Elige el día. El color indica la disponibilidad general.</p>

    <div class="calendar-header">
        <button type="button" id="prev-month" class="calendar-nav">‹</button>
        <strong id="calendar-title"></strong>
        <button type="button" id="next-month" class="calendar-nav">›</button>
    </div>

    <div class="calendar-weekdays">
        <span>L</span>
        <span>M</span>
        <span>X</span>
        <span>J</span>
        <span>V</span>
        <span>S</span>
        <span>D</span>
    </div>

    <div id="calendar-grid"
         class="calendar-grid calendar-month"
         data-api="{% url 'calendario_reservas_api' %}">
        <p class="muted">Cargando calendario...</p>
    </div>

    <form method="post" id="fecha-form">
        {% csrf_token %}

        <input id="fecha-reserva"
               type="hidden"
               name="fecha"
               min="{{ hoy|date:'Y-m-d' }}"
               required>

        <button class="button">Continuar</button>
    </form>

    <div class="calendar-legend">
        <span><i class="legend-dot disponible"></i> Disponible</span>
        <span><i class="legend-dot pocas"></i> Pocas plazas</span>
        <span><i class="legend-dot completo"></i> Completo</span>
        <span><i class="legend-dot cerrado"></i> Cerrado</span>
    </div>

    <a class="back-link" href="{% url 'inicio' %}">Volver</a>
</div>

<script>
    (function () {
        const fechaReserva = document.getElementById("fecha-reserva");
        const grid = document.getElementById("calendar-grid");
        const apiUrl = grid?.dataset.api;
        const title = document.getElementById("calendar-title");
        const prevBtn = document.getElementById("prev-month");
        const nextBtn = document.getElementById("next-month");

        let currentDate = new Date();
        let calendarData = [];

        const monthNames = [
            "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
            "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];

        function toISODate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, "0");
            const d = String(date.getDate()).padStart(2, "0");
            return `${y}-${m}-${d}`;
        }

        function getDayData(isoDate) {
            return calendarData.find(day => day.fecha === isoDate);
        }

        function renderMonth() {
            grid.innerHTML = "";

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            title.textContent = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            let startOffset = firstDay.getDay() - 1;
            if (startOffset < 0) startOffset = 6;

            for (let i = 0; i < startOffset; i++) {
                const empty = document.createElement("div");
                empty.className = "calendar-empty";
                grid.appendChild(empty);
            }

            for (let dayNumber = 1; dayNumber <= lastDay.getDate(); dayNumber++) {
                const date = new Date(year, month, dayNumber);
                const isoDate = toISODate(date);
                const day = getDayData(isoDate);

                const button = document.createElement("button");
                button.type = "button";
                button.className = "calendar-day-month";

                if (!day) {
                    button.classList.add("cerrado");
                    button.disabled = true;
                } else {
                    button.classList.add(day.estado);
                    button.disabled = day.bloqueado || day.estado === "completo" || day.estado === "pasado";

                    button.title = day.bloqueado
                        ? "Cerrado"
                        : day.estado === "completo"
                            ? "Completo"
                            : `${day.vacantes} plazas disponibles`;
                }

                button.dataset.fecha = isoDate;
                button.innerHTML = `<span>${dayNumber}</span>`;

                if (fechaReserva.value === isoDate) {
                    button.classList.add("selected");
                }

                button.addEventListener("click", () => {
                    fechaReserva.value = isoDate;
                    document.querySelectorAll(".calendar-day-month.selected")
                        .forEach(el => el.classList.remove("selected"));
                    button.classList.add("selected");
                });

                grid.appendChild(button);
            }
        }

        if (!grid || !apiUrl) return;

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                calendarData = data.dias || [];
                renderMonth();
            })
            .catch(() => {
                grid.innerHTML = '<p class="muted">No se pudo cargar el calendario.</p>';
            });

        prevBtn.addEventListener("click", () => {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
            renderMonth();
        });

        nextBtn.addEventListener("click", () => {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
            renderMonth();
        });
    })();
</script>
{% endblock %}
